<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYAS PTC Notifications</title>
    <link rel="icon" type="image/png" href="https://notifications.tyas.manzano.dev/static/icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #4169E1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #F5F5DC;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
            border: 2px solid #FFD700;
        }

        h1 {
            color: #C41E3A;
            margin-bottom: 10px;
            text-align: center;
            font-size: 42px;
        }

        .status {
            text-align: center;
            margin-bottom: 30px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
        }

        .status.listening {
            background-color: #d4f4dd;
            color: #155724;
            border: 1px solid #B8860B;
        }

        .status.offline {
            background-color: #ffd4d4;
            color: #C41E3A;
            border: 1px solid #C41E3A;
        }

        .notification-area {
            min-height: 200px;
            padding: 30px;
            background: white;
            border-radius: 8px;
            border: 2px dashed #E5E5E5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .notification-area.has-notification {
            background: #FFD700;
            border: 3px solid #C41E3A;
            animation: pulse 1s ease-in-out;
        }

        .time-display {
            font-size: 64px;
            font-weight: bold;
            color: #2F2F2F;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        .time-up-header {
            font-size: 36px;
            font-weight: bold;
            color: #C41E3A;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        .no-notification {
            color: #2F2F2F;
            font-size: 18px;
        }

        .notification-message {
            font-size: 20px;
            color: #2F2F2F;
            font-weight: 500;
            word-wrap: break-word;
            max-width: 100%;
            white-space: pre-wrap;
        }

        .notification-time {
            margin-top: 15px;
            color: #2F2F2F;
            font-size: 14px;
        }

        .click-prompt {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #C41E3A;
            color: #FFD700;
            padding: 40px 60px;
            border-radius: 16px;
            z-index: 1000;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease-in-out;
            cursor: pointer;
            border: 2px solid #FFD700;
            transition: background-color 0.3s;
        }

        .click-prompt:hover {
            background: #1B1B3D;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .check-interval {
            margin-top: 20px;
            text-align: center;
            color: #2F2F2F;
            font-size: 12px;
        }

        .schedule-button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background: #C41E3A;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .schedule-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(196, 30, 58, 0.5);
            background: #B8860B;
        }

        .schedule-button:active {
            transform: translateY(0);
        }

        .test-audio-button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #4169E1;
            color: white;
            border: 2px solid #FFD700;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        .test-audio-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(65, 105, 225, 0.5);
            background: #315AC1;
        }

        .test-audio-button:active {
            transform: translateY(0);
        }

        .test-audio-button:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
            border-color: #666;
        }

        .acknowledge-button {
            margin-top: 30px;
            padding: 16px 40px;
            background: #C41E3A;
            color: white;
            border: 2px solid #B8860B;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(196, 30, 58, 0.3);
            letter-spacing: 0.5px;
        }

        .acknowledge-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 30, 58, 0.5);
            background: #A01830;
        }

        .acknowledge-button:active {
            transform: translateY(0);
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>TYAS PTC Notifications</h1>
        <div id="status" class="status listening">
            Listening for notifications...
        </div>

        <div class="time-display" id="currentTime"></div>

        <div id="notificationArea" class="notification-area">
            <div class="icon">🔔</div>
            <div class="no-notification">Waiting for notifications...</div>
        </div>

        <div class="check-interval">Checking every 2 seconds</div>

        <a href="https://docs.google.com/spreadsheets/d/1g-Teswj4qZAW8FXjA2EApeii9Icb-Q_ZkdUFiKVBLok/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="schedule-button">
            📅 View PTC Schedule
        </a>

        <button id="testAudioButton" class="test-audio-button" onclick="testAudio()">
            🔊 Test Audio
        </button>
    </div>

    <div id="clickPrompt" class="click-prompt">
        🔊 Click anywhere to enable sound notifications 🔊
    </div>

    <audio id="notificationSound" preload="auto">
        <source src="https://notifications.tyas.manzano.dev/static/notification.mp3" type="audio/mpeg">
    </audio>

    <script>
        const notificationArea = document.getElementById('notificationArea');
        const statusDiv = document.getElementById('status');
        const audio = document.getElementById('notificationSound');
        const currentTimeDiv = document.getElementById('currentTime');
        const clickPrompt = document.getElementById('clickPrompt');
        const testAudioButton = document.getElementById('testAudioButton');

        let lastCheck = localStorage.getItem('lastCheck') || null;
        let isPlaying = false;
        let repeatSoundInterval = null;
        let isAcknowledged = false;

        // Update time every second
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            currentTimeDiv.textContent = `${hours}:${minutes}:${seconds}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        // Enable audio playback even when tab is not focused
        // This requires user interaction first
        document.addEventListener('click', () => {
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
                clickPrompt.style.display = 'none';
            }).catch(e => console.log('Audio setup:', e));
        }, { once: true });

        async function checkForNotifications() {
            try {
                const url = lastCheck
                    ? `https://notifications.tyas.manzano.dev/api/check?last_check=${encodeURIComponent(lastCheck)}`
                    : 'https://notifications.tyas.manzano.dev/api/check';

                const response = await fetch(url);
                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = 'Listening for notifications...';
                    statusDiv.className = 'status listening';

                    if (data.has_notification) {
                        displayNotification(data.message, data.timestamp);
                        lastCheck = data.timestamp;
                        localStorage.setItem('lastCheck', data.timestamp);
                        isAcknowledged = false;

                        // Play sound 3 times initially
                        if (!isPlaying) {
                            playSound(3);
                        }

                        // Start repeating sound every 30 seconds until acknowledged
                        if (repeatSoundInterval) {
                            clearInterval(repeatSoundInterval);
                        }
                        repeatSoundInterval = setInterval(() => {
                            if (!isAcknowledged && !isPlaying) {
                                playSound(3).catch(e => console.log('Repeat sound error:', e));
                            }
                        }, 30000); // Repeat every 30 seconds
                    }
                } else {
                    throw new Error('Failed to check notifications');
                }
            } catch (error) {
                console.error('Error checking notifications:', error);
                statusDiv.textContent = 'Connection error - retrying...';
                statusDiv.className = 'status offline';
            }
        }

        function displayNotification(message, timestamp) {
            const date = new Date(timestamp);
            const time = date.toLocaleString('en-US', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });

            notificationArea.className = 'notification-area has-notification';
            notificationArea.innerHTML = `
                <div class="time-up-header">⏰ Time is up! ⏰</div>
                <div class="icon">🔔</div>
                <div class="notification-message">${escapeHtml(message)}</div>
                <div class="notification-time">Received at ${time}</div>
                <button class="acknowledge-button" onclick="acknowledgeNotification()">Acknowledge & Stop Sound</button>
            `;
        }

        function acknowledgeNotification() {
            isAcknowledged = true;

            // Stop repeating sound
            if (repeatSoundInterval) {
                clearInterval(repeatSoundInterval);
                repeatSoundInterval = null;
            }

            // Update button to show acknowledgement
            const button = document.querySelector('.acknowledge-button');
            if (button) {
                button.textContent = 'Acknowledged';
                button.style.background = '#155724';
                button.style.borderColor = '#28A745';
                button.style.color = 'white';
                button.style.transform = 'none';
                button.disabled = true;
                button.style.cursor = 'default';
            }
        }

        async function playSound(times) {
            // Prevent concurrent playback attempts
            if (isPlaying) {
                console.log('Audio already playing, skipping');
                return;
            }

            isPlaying = true;

            try {
                for (let i = 0; i < times; i++) {
                    try {
                        audio.currentTime = 0;
                        await audio.play();
                        // Wait for audio to finish playing
                        await new Promise(resolve => {
                            audio.onended = resolve;
                        });
                    } catch (error) {
                        console.error('Error playing sound:', error);
                        break;
                    }
                }
            } finally {
                // Always reset isPlaying even if errors occur
                isPlaying = false;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function testAudio() {
            if (isPlaying) {
                return; // Don't start if already playing
            }

            // Disable button during test
            testAudioButton.disabled = true;
            testAudioButton.textContent = '🔊 Playing...';

            try {
                // Play sound 3 times just like a real notification
                await playSound(3);
                testAudioButton.textContent = '✓ Audio Test Complete';

                // Reset button after 2 seconds
                setTimeout(() => {
                    testAudioButton.disabled = false;
                    testAudioButton.textContent = '🔊 Test Audio';
                }, 2000);
            } catch (error) {
                console.error('Error testing audio:', error);
                testAudioButton.textContent = '❌ Audio Test Failed';
                testAudioButton.disabled = false;

                // Reset button after 2 seconds
                setTimeout(() => {
                    testAudioButton.textContent = '🔊 Test Audio';
                }, 2000);
            }
        }

        // Check for notifications every 2 seconds
        setInterval(checkForNotifications, 2000);

        // Initial check
        checkForNotifications();
    </script>
</body>
</html>
